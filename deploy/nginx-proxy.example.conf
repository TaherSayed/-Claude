# Alternative to Caddy if the VPS already runs nginx (e.g. for TimeOs).
# Get the certificate with: certbot --nginx -d barber.example.de
server {
    listen 80;
    server_name barber.example.de;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
